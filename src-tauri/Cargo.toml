[package]
name = "sonatune"
version = "0.1.0"
description = "SonaTune - Desktop Audio Enhancement Application"
authors = ["SonaTune Team"]
license = "MIT"
repository = ""
edition = "2021"

[lib]
name = "sonatune"
path = "src/lib.rs"

[[bin]]
name = "sonatune"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-shell = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cpal = "0.15"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "aac", "isomp4", "pcm"] }
directories = "5.0"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
